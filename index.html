<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Approval page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 24px;
      background: #f7f7f7;
      color: #222;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
    }
    .muted { color: #666; }
    .error { color: #b00020; }
    button {
      margin-right: 8px;
      padding: 8px 14px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }
    .approve { background: #1f8f4a; color: white; }
    .deny { background: #c62828; color: white; }
    .item {
      border: 1px solid #e5e5e5;
      border-radius: 10px;
      padding: 12px;
      margin-top: 12px;
      background: #fafafa;
    }
    a { color: #0b57d0; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Approval page</h1>
    <div id="status" class="muted">Ładowanie...</div>
    <div id="user" style="margin-top:8px;"></div>
  </div>

  <div class="card">
    <h2>Pending items</h2>
    <div id="items" class="muted">Ładowanie...</div>
  </div>

  <script>
    const statusEl = document.getElementById("status");
    const userEl = document.getElementById("user");
    const itemsEl = document.getElementById("items");

    async function api(url, options = {}) {
      const response = await fetch(url, {
        credentials: "include",
        headers: {
          "Content-Type": "application/json",
          ...(options.headers || {})
        },
        ...options
      });

      const data = await response.json().catch(() => ({}));
      if (!response.ok || data.success === false) {
        throw new Error(data.error || `HTTP ${response.status}`);
      }
      return data;
    }

    function escapeHtml(s) {
      return String(s || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeJs(s) {
      return String(s || "").replaceAll("\\", "\\\\").replaceAll("'", "\\'");
    }

    async function loadMe() {
      const data = await api("/api/me");
      const u = data.user || {};
      userEl.innerHTML = `
        <strong>${escapeHtml((u.firstname || "") + " " + (u.lastname || "")).trim()}</strong><br>
        <span class="muted">${escapeHtml(u.username || "")}</span>
      `;
      return u;
    }

    async function loadItems() {
      const data = await api("/api/pending-items");
      const items = data.items || [];

      if (!items.length) {
        itemsEl.innerHTML = '<div class="muted">Brak oczekujących wpisów.</div>';
        return;
      }

      itemsEl.innerHTML = items.map(item => `
        <div class="item">
          <div><strong>${escapeHtml(item.course_name || "Unknown course")}</strong></div>
          <div class="muted">User: ${escapeHtml(item.fullname || item.username || "")}</div>
          <div class="muted">Email: ${escapeHtml(item.email || "")}</div>
          <div class="muted">Session: ${escapeHtml(item.session_name || "-")}</div>
          <div class="muted">Status: ${escapeHtml(item.enrollment_status || "")}</div>
          <div style="margin-top:10px;">
            <button class="approve" onclick="approveItem('${escapeJs(item.course_id)}','${escapeJs(item.session_id)}','${escapeJs(item.user_id)}')">Approve</button>
            <button class="deny" onclick="denyItem('${escapeJs(item.course_id)}','${escapeJs(item.session_id)}','${escapeJs(item.user_id)}')">Deny</button>
            <a href="${item.course_url || '#'}" target="_blank" rel="noreferrer">Open course</a>
          </div>
        </div>
      `).join("");
    }

    async function approveItem(courseId, sessionId, userId) {
      if (!confirm("Approve this enrollment?")) return;
      await api("/api/approve", {
        method: "POST",
        body: JSON.stringify({ courseId, sessionId, userId })
      });
      await loadItems();
    }

    async function denyItem(courseId, sessionId, userId) {
      if (!confirm("Deny this enrollment?")) return;
      await api("/api/deny", {
        method: "POST",
        body: JSON.stringify({ courseId, sessionId, userId })
      });
      await loadItems();
    }

    (async () => {
      try {
        statusEl.textContent = "Sprawdzam sesję...";
        await loadMe();
        statusEl.textContent = "Zalogowano";
        await loadItems();
      } catch (err) {
        statusEl.innerHTML = `<span class="error">${escapeHtml(err.message)}</span>`;
        itemsEl.innerHTML = '<div class="muted">Nie udało się wczytać danych.</div>';
      }
    })();
  </script>
</body>
</html>
