<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Approvals</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #f5f5f5;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    button {
      padding: 10px 16px;
      margin-right: 10px;
      cursor: pointer;
    }

  </style>

</head>

<body>

  <h1>Pending Enrollments</h1>

  <div id="content">
    Loading...
  </div>

  <script>

    async function api(
      url,
      options = {}
    ) {

      const response = await fetch(
        url,
        {
          credentials: 'include',
          ...options
        }
      );

      return response.json();
    }

    async function load() {

      try {

        const me =
          await api('/api/me');

        console.log(
          'ME:',
          me
        );

        const data =
          await api(
            '/api/pending-items'
          );

        console.log(
          'PENDING:',
          data
        );

        const content =
          document.getElementById(
            'content'
          );

        if (
          !data.items
          || !data.items.length
        ) {

          content.innerHTML =
            '<div class="card">No pending enrollments.</div>';

          return;
        }

        content.innerHTML = '';

        data.items.forEach(
          item => {

            const div =
              document.createElement(
                'div'
              );

            div.className =
              'card';

            div.innerHTML = `

              <h3>${item.course_name}</h3>

              <p>
                <strong>User:</strong>
                ${item.fullname}
              </p>

              <p>
                <strong>Email:</strong>
                ${item.email}
              </p>

              <p>
                <strong>Session:</strong>
                ${item.session_name}
              </p>

              <button
                onclick="approve(
                  '${item.course_id}',
                  '${item.session_id}',
                  '${item.user_id}'
                )"
              >
                Approve
              </button>

              <button
                onclick="deny(
                  '${item.course_id}',
                  '${item.session_id}',
                  '${item.user_id}'
                )"
              >
                Deny
              </button>
            `;

            content.appendChild(
              div
            );
          }
        );
      }
      catch (error) {

        console.error(error);

        document.getElementById(
          'content'
        ).innerHTML = `
          <div class="card">
            Error loading dashboard.
          </div>
        `;
      }
    }

    async function approve(
      courseId,
      sessionId,
      userId
    ) {

      await api(
        '/api/approve',
        {
          method: 'POST',

          headers: {
            'Content-Type':
              'application/json'
          },

          body: JSON.stringify({

            courseId,
            sessionId,
            userId
          })
        }
      );

      load();
    }

    async function deny(
      courseId,
      sessionId,
      userId
    ) {

      await api(
        '/api/deny',
        {
          method: 'POST',

          headers: {
            'Content-Type':
              'application/json'
          },

          body: JSON.stringify({

            courseId,
            sessionId,
            userId
          })
        }
      );

      load();
    }

    load();

  </script>

</body>
</html>
