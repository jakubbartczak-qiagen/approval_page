<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Approval page</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --card: #fff;
      --text: #1f2937;
      --muted: #6b7280;
      --danger: #b42318;
      --border: #e5e7eb;
    }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .wrap {
      padding: 18px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 1px 8px rgba(0,0,0,.04);
      padding: 18px;
      margin-bottom: 16px;
    }
    h1, h2 {
      margin: 0 0 14px;
    }
    .error {
      color: var(--danger);
      margin: 0 0 10px;
    }
    .muted {
      color: var(--muted);
    }
    .item {
      border-top: 1px solid var(--border);
      padding: 14px 0;
    }
    .item:first-child {
      border-top: 0;
      padding-top: 0;
    }
    .btns {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    button {
      border: 0;
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
    }
    .approve { background: #16a34a; color: white; }
    .deny { background: #dc2626; color: white; }
    a {
      color: #2563eb;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Approval page</h1>
      <div id="status" class="error">Loading…</div>
      <div id="user" class="muted"></div>
    </div>

    <div class="card">
      <h2>Pending items</h2>
      <div id="items" class="muted">Loading pending items…</div>
    </div>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const userEl = document.getElementById('user');
    const itemsEl = document.getElementById('items');

    async function api(path, options = {}) {
      const res = await fetch(path, {
        credentials: 'include',
        headers: { 'Content-Type': 'application/json', ...(options.headers || {}) },
        ...options
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
      return data;
    }

    function renderItems(items) {
      if (!items.length) {
        itemsEl.innerHTML = '<div class="muted">No pending items found.</div>';
        return;
      }

      itemsEl.innerHTML = items.map(item => `
        <div class="item">
          <div><strong>${item.fullname || item.username || item.user_id}</strong></div>
          <div class="muted">${item.email || ''}</div>
          <div>${item.course_name || ''}</div>
          <div><a href="${item.course_url}" target="_blank" rel="noreferrer">Open course</a></div>
          <div class="btns">
            <button class="approve" data-action="approve" data-user="${item.user_id}" data-course="${item.course_id}" data-session="${item.session_id || ''}">Approve</button>
            <button class="deny" data-action="deny" data-user="${item.user_id}" data-course="${item.course_id}" data-session="${item.session_id || ''}">Deny</button>
          </div>
        </div>
      `).join('');

      itemsEl.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', async () => {
          const payload = {
            userId: btn.dataset.user,
            courseId: btn.dataset.course,
            sessionId: btn.dataset.session || undefined
          };
          const path = btn.dataset.action === 'approve' ? '/api/approve' : '/api/deny';
          btn.disabled = true;
          try {
            await api(path, {
              method: 'POST',
              body: JSON.stringify(payload)
            });
            await load();
          } catch (e) {
            alert(e.message);
          } finally {
            btn.disabled = false;
          }
        });
      });
    }

    async function load() {
      try {
        const me = await api('/api/me');
        userEl.textContent = `Logged in as: ${me.user.firstname || ''} ${me.user.lastname || ''} (${me.user.username})`.trim();
        const data = await api('/api/pending-items');
        statusEl.textContent = '';
        renderItems(data.items || []);
      } catch (e) {
        statusEl.textContent = 'Failed to load pending items';
        itemsEl.textContent = 'Nie udało się wczytać danych.';
        userEl.textContent = '';
      }
    }

    load();
  </script>
</body>
</html>
