<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aplikacja</title>
</head>
<body>
  <h1>Moja aplikacja</h1>
  <pre id="me">Ładowanie...</pre>

  <script>
    fetch("/api/me", { credentials: "include" })
      .then(async r => {
        if (!r.ok) throw new Error("Brak sesji");
        return r.json();
      })
      .then(data => {
        document.getElementById("me").textContent = JSON.stringify(data, null, 2);
      })
      .catch(err => {
        document.getElementById("me").textContent = "Nie zalogowano: " + err.message;
      });
  </script>
</body>
</html>
